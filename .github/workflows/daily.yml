name: Daily clip run
on:
  # Started at 7:23am Central by cron-job.org (GitHub's own timer fired hours late and caused double runs).
  # The views workflow's watchdog is the backup if nothing ran by mid-morning.
  workflow_dispatch:
    inputs:
      force: { description: 'Run even if a clip run already happened today', type: boolean, default: false }
permissions:
  contents: write
  actions: read
concurrency: { group: clips, cancel-in-progress: false }
jobs:
  once:   # only one clip run per day (saves ~50 cloud minutes per duplicate trigger)
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - id: c
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          today=$(TZ=America/Chicago date +%F)
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily.yml --limit 15 --json databaseId,createdAt,conclusion,status \
              --jq ".[] | select(.databaseId != ${{ github.run_id }}) | select(.conclusion == \"success\" or .status == \"in_progress\") | .createdAt" \
              | while read t; do TZ=America/Chicago date -d "$t" +%F; done | grep -c "^$today$" || true)
          if [ "$n" != "0" ] && [ "${{ inputs.force }}" != "true" ]; then echo "Already ran today - skipping"; echo "go=no" >> $GITHUB_OUTPUT; else echo "go=yes" >> $GITHUB_OUTPUT; fi
  run:
    needs: once
    if: needs.once.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      CLOUD: '1'
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install ffmpeg + fonts
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ttf-mscorefonts-installer tesseract-ocr >/dev/null && fc-cache -f >/dev/null
          fc-list | grep -i "arial black" | head -1
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-small-en-v1 }
      - name: Python tools
        run: |
          python -m venv clipper/.venv
          clipper/.venv/bin/pip install -q faster-whisper==1.2.1 yt-dlp
      - name: Wire up paths and keys
        env:
          PH_KEY: ${{ secrets.PH_AUTOMATION_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p ~/.local/bin ~/Projects
          ln -sf "$(which ffmpeg)" ~/.local/bin/ffmpeg
          ln -sf "$GITHUB_WORKSPACE/clipper/.venv/bin/yt-dlp" ~/.local/bin/yt-dlp
          ln -sf "$(which node)" ~/.local/bin/node
          ln -sfn "$GITHUB_WORKSPACE/clipper" ~/Projects/clipper
          ln -sfn "$GITHUB_WORKSPACE/post-hub" ~/Projects/post-hub
          umask 077; printf '%s' "$PH_KEY" > ~/.posthub_key; printf '%s' "$GEMINI_KEY" > ~/.gemini_key
      - name: Clips (fetch, AI pick, cut, schedule)
        run: clipper/.venv/bin/python clipper/auto/morning.py
      - name: Nightly report
        if: always()
        run: python3 clipper/auto/nightly.py
      - name: Save memory (used clips, stats, Brand Brain learnings)
        if: always()
        run: |
          git config user.name "jarvis-bot"; git config user.email "jarvis-bot@users.noreply.github.com"
          git add clipper/work/used_clips.txt clipper/brain clipper/auto/stats post-hub/data/pushed.txt
          git diff --cached --quiet || (git commit -qm "Jarvis daily run $(date -u +%F)" && for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            clipper/auto/*.log
          retention-days: 7
