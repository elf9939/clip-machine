name: Daily clip run
on:
  schedule:
    - cron: '23 23 * * *'    # 5:23pm Central (odd minute = fewer GitHub delays)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: clips, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      CLOUD: '1'
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install ffmpeg + fonts
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ttf-mscorefonts-installer >/dev/null && fc-cache -f >/dev/null
          fc-list | grep -i "arial black" | head -1
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-small-en-v1 }
      - name: Python tools
        run: |
          python -m venv clipper/.venv
          clipper/.venv/bin/pip install -q faster-whisper==1.2.1 yt-dlp
      - name: Wire up paths and keys
        env:
          PH_KEY: ${{ secrets.PH_AUTOMATION_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p ~/.local/bin ~/Projects
          ln -sf "$(which ffmpeg)" ~/.local/bin/ffmpeg
          ln -sf "$GITHUB_WORKSPACE/clipper/.venv/bin/yt-dlp" ~/.local/bin/yt-dlp
          ln -sf "$(which node)" ~/.local/bin/node
          ln -sfn "$GITHUB_WORKSPACE/clipper" ~/Projects/clipper
          ln -sfn "$GITHUB_WORKSPACE/post-hub" ~/Projects/post-hub
          umask 077; printf '%s' "$PH_KEY" > ~/.posthub_key; printf '%s' "$GEMINI_KEY" > ~/.gemini_key
      - name: Clips (fetch, AI pick, cut, schedule)
        run: clipper/.venv/bin/python clipper/auto/morning.py
      - name: Nightly report
        if: always()
        run: python3 clipper/auto/nightly.py
      - name: Save memory (used clips, stats, Brand Brain learnings)
        if: always()
        run: |
          git config user.name "jarvis-bot"; git config user.email "jarvis-bot@users.noreply.github.com"
          git add clipper/work/used_clips.txt clipper/brain clipper/auto/stats post-hub/data/pushed.txt
          git diff --cached --quiet || (git commit -qm "Jarvis daily run $(date -u +%F)" && git push -q)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            clipper/auto/*.log
          retention-days: 7
