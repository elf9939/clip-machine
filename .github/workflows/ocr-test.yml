name: OCR caption test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr >/dev/null
          mkdir -p ~/.local/bin && ln -sf "$(which ffmpeg)" ~/.local/bin/ffmpeg
          python3 - <<'PY'
          import os, re, subprocess
          src = open('clipper/auto/morning.py').read(); i = src.index('def has_burned_captions'); j = src.index('def pick(')
          import json
          exec(src[i:j])
          print('captioned clip  ->', has_burned_captions('testclips/cap.mp4', 10, 28, 'testclips/cap.words.json'))
          print('clean clip      ->', has_burned_captions('testclips/nocap.mp4', 0, 15, 'testclips/nocap.words.json'))
          PY
