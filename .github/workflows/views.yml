name: View check
on:
  # Started every 4 hours by cron-job.org (GitHub's own timer skipped most runs).
  workflow_dispatch:
permissions:
  actions: write
  contents: write
jobs:
  views:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Check views
        env: { PH_KEY: "${{ secrets.PH_AUTOMATION_KEY }}" }
        run: |
          pip install -q yt-dlp && mkdir -p ~/.local/bin && ln -sf "$(which yt-dlp)" ~/.local/bin/yt-dlp
          umask 077; printf '%s' "$PH_KEY" > ~/.posthub_key
          python clipper/auto/views.py
      - name: Winners -> YouTube Shorts
        if: false   # paused (Nov 18): every approved clip already goes to YouTube; this was stacking old clips into the same slots
        continue-on-error: true   # a hiccup here must not stop the watchdog below
        run: |
          python clipper/auto/shorts.py
          git config user.name "jarvis-bot"; git config user.email "jarvis-bot@users.noreply.github.com"
          git add clipper/data/shorts_done.txt
          git diff --cached --quiet || (git commit -qm "Shorts scheduled" && for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done)
      - name: Start a fast-mode round (12pm, 4pm, 8pm Central) — GitHub's own timer skips runs, this one is reliable
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          h=$(TZ=America/Chicago date +%H)
          if [ "$h" = "11" ] || [ "$h" = "12" ] || [ "$h" = "19" ] || [ "$h" = "20" ]; then gh workflow run stream.yml --repo "$GITHUB_REPOSITORY" -f target=5 -f minutes=40 && echo "fast-mode round started"; else echo "not a round hour ($h)"; fi
      - name: Watchdog - start today's clip run if GitHub skipped it
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          now_ct=$(TZ=America/Chicago date +%H%M); today_ct=$(TZ=America/Chicago date +%F)
          if [ "$now_ct" -ge 0723 ]; then
            started=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily.yml --limit 10 --json createdAt --jq '.[].createdAt' | while read t; do TZ=America/Chicago date -d "$t" +%F; done | grep -c "^$today_ct$" || true)
            if [ "$started" = "0" ]; then echo "No clip run yet today - starting it"; gh workflow run daily.yml --repo "$GITHUB_REPOSITORY"; else echo "Clip run already ran today"; fi
          else echo "Before 7:23 AM Central - nothing to check"; fi
